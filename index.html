<!DOCTYPE html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Compass One Page</title>
<style>
/* Layout: one page. Laptop: three columns (Now | Calendar | Describe & lists). Phone: stacked, with jump links. Setup lives behind the gear. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --ink:#141C26; --muted:#5A6676; --line:#D6DCE3;
  --accent:#2B47B0; --accent-ink:#FFFFFF; --needle:#C8432B; --good:#1E8A5A; --warn:#B7791F;
  --a-academia:#3E6FD8; --a-sports:#1F9D6B; --a-arts:#A64FC0; --a-social:#C9821A; --a-people:#D9506F; --a-finance:#7F7A2A; --a-health:#2696AA; --a-growth:#6A58D8;
  /* item-type colours: the same hex values are used in Google Calendar and suggested for Apple Calendar */
  --t-event:#039BE5; --t-reminder:#8E24AA; --t-deadline:#D50000; --t-routine:#33B679; --t-task:#F6BF26;
  --f-display:"Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-body:"Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-mono:"Helvetica Neue", Helvetica, Arial, sans-serif; /* labels and times: same family, tabular figures */
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141A; --surface:#18202A; --surface-2:#1D2632; --ink:#E5EAF0; --muted:#98A4B2; --line:#2B3644;
  --accent:#8FA5FF; --accent-ink:#0F141A; --needle:#FF7B5E; --good:#4CC28A; --warn:#E6AE52;
  --a-academia:#6F98F0; --a-sports:#43C08C; --a-arts:#C77FDC; --a-social:#E6A447; --a-people:#F07A95; --a-finance:#B8B25A; --a-health:#4DBFD2; --a-growth:#9586F0;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F141A; --surface:#18202A; --surface-2:#1D2632; --ink:#E5EAF0; --muted:#98A4B2; --line:#2B3644;
  --accent:#8FA5FF; --accent-ink:#0F141A; --needle:#FF7B5E; --good:#4CC28A; --warn:#E6AE52;
  --a-academia:#6F98F0; --a-sports:#43C08C; --a-arts:#C77FDC; --a-social:#E6A447; --a-people:#F07A95; --a-finance:#B8B25A; --a-health:#4DBFD2; --a-growth:#9586F0;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:400;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1680px;margin:0 auto;padding-inline:clamp(12px,2.2vw,32px);padding-block:0 64px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0}
.brand svg{flex:none}
.status{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding-block:8px;border-bottom:1px solid var(--line)}
nav.tabs button{font:500 13px var(--f-body);color:var(--muted);background:none;border:0;padding:8px 2px;border-radius:8px;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);background:var(--surface);box-shadow:0 0 0 1px var(--line)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.view{padding-block:18px 0;display:grid;gap:16px}
h2{font-family:var(--f-display);font-weight:700;font-size:21px;margin:0;text-wrap:balance;letter-spacing:-.015em}
h3{font-family:var(--f-display);font-weight:500;font-size:16px;margin:0;letter-spacing:-.005em}
.eyebrow{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.quote{margin:0 0 4px;padding:14px 16px 12px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 var(--r) var(--r) 0;display:grid;gap:4px}
.quote blockquote{margin:0;font:300 19px/1.4 var(--f-display);letter-spacing:-.01em;text-wrap:pretty}
.quote figcaption{font-size:13px;color:var(--muted)}
.quote figcaption::before{content:"— "}
.q-list{display:grid;border:1px solid var(--line);border-radius:8px;max-height:380px;overflow-y:auto}
.q-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.q-row:last-child{border-bottom:0}
.q-row.off .q-txt{opacity:.5}
.q-row.editing{grid-template-columns:1fr;background:var(--surface-2)}
.q-txt{display:grid;gap:2px;min-width:0;overflow-wrap:anywhere;font-size:14px}
.q-on input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.q-fields,.q-add{display:grid;gap:8px}
textarea.q-ta{min-height:64px}
@media (max-width:520px){.q-row{grid-template-columns:auto 1fr}.q-btns{grid-column:2}}
.dchip-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:2px 0}
.dchip{display:inline-flex;align-items:center;gap:7px;font:600 15px var(--f-body);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.dchip:hover{border-color:var(--accent)}
.dchip.guess{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.dchip.past{border-color:var(--needle);background:color-mix(in srgb,var(--needle) 10%,var(--surface))}
.gtag,.ptag{font:600 10px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:2px 5px;color:#fff}
.gtag{background:var(--warn)}.ptag{background:var(--needle)}
.gline{font-size:12.5px;color:var(--warn);display:block}
.gline .btn{margin-left:4px;vertical-align:middle}
.typeseg.dedit{background:var(--surface-2);padding-top:8px;border-radius:0}
.gd.sq{border-radius:0}
.gtip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font:500 12px var(--f-body);padding:4px 8px;border-radius:6px;white-space:nowrap;max-width:calc(100vw - 16px);overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.cal .gdots .gd{cursor:default}
.g-add .seg,.g-row.editing .seg{justify-self:start}
.g-sw.sq{border-radius:0}
.g-freq{font:500 10px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:middle}
.g-group{display:grid;gap:8px}
.g-group+.g-group{border-top:1px solid var(--line);padding-top:12px}
.g-chip.wk{border-radius:9px}
.g-chip.wk .g-done{border-radius:7px}
.g-sub{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 12px 4px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.g-row[data-gid]{grid-template-columns:auto auto 1fr auto;background:var(--surface);position:relative}
.g-grip{all:unset;box-sizing:border-box;width:28px;height:32px;display:grid;place-items:center;color:var(--muted);cursor:grab;touch-action:none;border-radius:6px}
.g-grip:hover{background:var(--surface-2);color:var(--ink)}
.g-grip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.g-row.g-dragging{z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.18);border-radius:8px;outline:1px solid var(--line)}
.g-row.g-dragging .g-grip{cursor:grabbing}
body.g-sorting{cursor:grabbing;user-select:none;-webkit-user-select:none}
.g-list{display:grid;border:1px solid var(--line);border-radius:8px;max-height:340px;overflow-y:auto;overscroll-behavior:contain}
.g-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.g-row:last-child{border-bottom:0}
.g-row.editing{grid-template-columns:1fr;background:var(--surface-2)}
.g-sw{width:14px;height:14px;border-radius:50%;background:var(--c)}
.g-label{min-width:0;overflow-wrap:anywhere;font-size:14px}
.g-add{display:grid;gap:8px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);background:var(--c);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-checked="true"]{box-shadow:0 0 0 2px var(--ink)}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.g-chips{display:flex;flex-wrap:wrap;gap:8px}
.g-chip{display:inline-flex;align-items:center;gap:8px;padding:5px 5px 5px 12px;border-radius:999px;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));font-weight:600;font-size:14px;max-width:100%;overflow:hidden;white-space:nowrap;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .35s ease,width .35s ease,padding .35s ease,margin .35s ease,border-width .35s ease}
.g-chip .g-label{overflow:hidden;text-overflow:ellipsis;font-size:14px}
.g-done{all:unset;box-sizing:border-box;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--c);color:transparent;background:var(--surface);cursor:pointer;flex:none;transition:background .2s,color .2s,transform .2s}
.g-done:hover{color:var(--c)}
.g-done:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.g-chip.popping{transform:scale(1.08);background:var(--c);color:#fff}
.g-chip.popping .g-done{background:#fff;color:var(--c);transform:scale(1.15)}
.g-chip.gone{transform:scale(.6);opacity:0;width:0!important;padding-left:0;padding-right:0;margin-right:-8px;border-width:0}
.g-spark{position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:50;transform:translate(-50%,-50%);animation:gspark .75s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes gspark{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
.g-today-dots{display:inline-flex;align-items:center;gap:3px}
.g-today-dots .nums{margin-left:6px}
.gd{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.g-all{margin:0;color:var(--good);font-weight:600}
.cal .nrow{display:flex;align-items:center;gap:4px;min-width:0}
.cal .gdots{display:flex;gap:2px;overflow:hidden;min-width:0}
.cal .gdots .gd{width:6px;height:6px}
@media (prefers-reduced-motion: reduce){.g-chip{transition:none}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.btn{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.needle{background:var(--needle);color:#fff;border-color:var(--needle)}
.btn.ghost{background:none}
.btn.sm{font-size:12.5px;padding:5px 10px}
.chip{font:500 12.5px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 10px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.tag{font:500 11.5px var(--f-mono);padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.hot{color:var(--needle);border-color:color-mix(in srgb,var(--needle) 40%,var(--line))}
.tag.warm{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.tag.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.tag.cool{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
input[type=text],input[type=number],input[type=date],input[type=time],select{font:15px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
input[type=text]{width:100%}
label.fld{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:500 13px var(--f-body);border:0;background:none;color:var(--muted);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px;font-size:13.5px}

/* Now card */
.btn.done-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--good);color:#fff;border-color:var(--good)}
.btn.done-btn:hover{filter:brightness(1.06)}
.now.finishing{transition:transform .3s cubic-bezier(.3,1.6,.5,1),background .3s,border-color .3s,opacity .38s ease;transform:scale(1.025);border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.now.finishing .deck-actions,.now.finishing .title,.now.finishing .meta{transition:opacity .25s}
.now.finishing.gone{transform:scale(.92) translateY(8px);opacity:0}
.done-stamp{position:absolute;left:50%;top:50%;margin:-34px 0 0 -34px;width:68px;height:68px;z-index:2;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;animation:stampIn .45s cubic-bezier(.3,1.7,.5,1) both;box-shadow:0 6px 18px color-mix(in srgb,var(--good) 40%,transparent)}
.done-stamp svg{width:36px;height:36px;stroke-dasharray:24;stroke-dashoffset:24;animation:drawCheck .35s .15s ease-out forwards}
@keyframes stampIn{from{transform:scale(0) rotate(-25deg)}to{transform:scale(1) rotate(0)}}
@keyframes drawCheck{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.now.finishing{transition:none}}
.cat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.cat-dot.cat-school{background:#3949AB}.cat-dot.cat-extra{background:#00897B}.cat-dot.cat-personal{background:#C2185B}
.cat-label{display:inline-flex;align-items:center;gap:5px}
.task-body{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.task-body.has-note{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.task-body .title{align-self:center}
.note-add{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:5px;font:500 12.5px var(--f-body);color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.note-add:hover{color:var(--ink);border-color:var(--muted)}
.task-body .note-add{align-self:center}
.note-add:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.due-label.late{color:var(--needle)}
@media (max-width:380px){.task-body.has-note{grid-template-columns:1fr}}
.task-note{display:grid;gap:4px}
.task-note-in{width:100%;min-height:58px;resize:vertical;font:400 14px/1.45 var(--f-body);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;user-select:text;-webkit-user-select:text}
.task-note-in::placeholder{color:var(--muted)}
.task-note-in:focus{outline:2px solid var(--accent);outline-offset:1px;background:var(--surface)}
.task-note-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.cat-pick{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border:1px dashed var(--warn);border-radius:10px;background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.cat-pick .btn{display:inline-flex;align-items:center;gap:6px}
.need-cat{font:600 10.5px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--warn)}
.need-cat-msg{color:var(--warn)}
.now{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px 18px;display:grid;gap:14px;overflow:hidden}
.now::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--area,var(--accent))}
.now .title{font-family:var(--f-display);font-weight:700;font-size:clamp(19px,4.2vw,24px);line-height:1.2;letter-spacing:-.015em;margin:0;text-wrap:balance}
.now .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:8px}
@media (max-width:480px){.actions{grid-template-columns:1fr 1fr 1fr}.actions .btn:first-child{grid-column:1/-1}}
.timer{font-family:var(--f-mono);font-size:clamp(44px,12vw,64px);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.why{display:flex;gap:6px;flex-wrap:wrap}
.hush{font-size:13px;color:var(--muted);text-align:center}
.context{display:flex;gap:10px;align-items:center;font-size:13.5px;padding:10px 14px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line)}

/* Timeline */
.tl{display:grid;gap:0}
.tl-row{display:grid;grid-template-columns:52px 4px 1fr auto;gap:12px;align-items:center;padding-block:9px;border-bottom:1px solid var(--line)}
.tl-row:last-child{border-bottom:0}
.tl-row .t{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.tl-row .bar{align-self:stretch;border-radius:2px;background:var(--c,var(--line));min-height:22px}
.tl-row .body{min-width:0}
.tl-row .body b{font-weight:600;display:block;overflow-wrap:anywhere}
.tl-row.past{opacity:.5}
.tl-row.free .body{color:var(--muted);font-style:italic}
.big{font:700 10.5px var(--f-mono);color:var(--needle);letter-spacing:.06em}
.check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);background:none;cursor:pointer;display:grid;place-items:center;color:var(--bg)}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good)}

/* lists */
.list{display:grid}
.li{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding-block:9px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .txt{min-width:0}
.li .txt b{font-weight:500;overflow-wrap:anywhere}
.score{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}

/* areas */
.area-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:12px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.area-row:last-child{border-bottom:0}
.meter{height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.nums{font:500 12.5px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.radar text{font:500 11px var(--f-body);fill:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.cap{height:14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);position:relative;overflow:hidden}
.cap i{position:absolute;inset:0 auto 0 0}
.cap .m{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.big-num{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:120px;font:12px var(--f-mono);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px}
/* describe + focus */

<script>
(function(){
"use strict";
/* ---------- constants & helpers ---------- */
const AREAS0=[
 {id:"academia",name:"Academia",target:20},{id:"sports",name:"Sports",target:6},
 {id:"arts",name:"Arts & Culture",target:3},{id:"social",name:"Social Work",target:3},
 {id:"people",name:"People",target:5},{id:"finance",name:"Finance",target:1},
 {id:"health",name:"Health & Care",target:6},{id:"growth",name:"Growth",target:3}];
const EFFORT={S:15,M:45,L:90};
const SIZE_LABEL={S:"15 min",M:"45 min",L:"90 min"};
const STAKES=["Nothing","Annoying","Serious"];
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const $=(s,r=document)=>r.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const hm2min=s=>{if(!s)return 0;const[h,m]=s.split(":").map(Number);return h*60+(m||0)};
const min2hm=m=>{m=Math.max(0,Math.round(m));return pad(Math.floor(m/60)%24)+":"+pad(m%60)};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const today=()=>ymd(new Date());
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dowOf=ds=>new Date(ds+"T12:00").getDay();
const fmtHrs=m=>{const h=m/60;return (h>=10?Math.round(h):Math.round(h*10)/10)+"h"};
function weekStart(d=new Date()){const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);x.setHours(0,0,0,0);return x}
function dueLabel(ds){
  const t=today(); if(ds<t)return "Overdue"; if(ds===t)return "Due today";
  if(ds===ymd(addDays(new Date(),1)))return "Due tomorrow";
  const diff=(new Date(ds+"T12:00")-new Date(t+"T12:00"))/864e5;
  if(diff<7)return "Due "+DOW[dowOf(ds)];
  const d=new Date(ds+"T12:00");return "Due "+d.getDate()+"/"+(d.getMonth()+1);
}

/* ---------- state ---------- */
let state=null, tab="now", store="memory", docRef=null, saveTimer=null, saving=Promise.resolve();
let nowCardId=null,nowCardPos=null,nowAnim=null,noteOpen=null;
let timer=null, draft=freshDraft(), showLate=false, ai=null, aiChecked=false;
let describe={text:"",busy:false,ctl:null,preview:null,changes:[],questions:[],error:"",fallback:false};
let focusUI={text:"",busy:false,ctl:null,result:null,error:"",undo:null};
let calEdit=null;
let calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1), calSel=ymd(new Date()), calRoll=0;
/* Two calendar layouts: "rolling" (default) puts this week on the top row; "month" follows the calendar month. */
const calRolling=()=>state.settings.calView!=="month";
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};
const ROLL_WEEKS=5;
function rollStart(){return addDays(mondayOf(new Date()),calRoll*7)}
/* jump the calendar so a given date is on screen, in either layout */
function calJump(d){calMonth=new Date(d.getFullYear(),d.getMonth(),1);
  const s0=rollStart(),ds=ymd(d);if(ds<ymd(s0)||ds>=ymd(addDays(s0,ROLL_WEEKS*7)))calRoll=Math.round((mondayOf(d)-mondayOf(new Date()))/(7*864e5))}
let calTool="describe";
try{const t=localStorage.getItem("compass-tab");if(t)tab=(t==="areas"||t==="add")?"calendar":(t==="review"||t==="today")?"now":t;const ct=localStorage.getItem("compass-tool");if(ct)calTool=ct}catch(e){}

function R(title,area,days,time,minutes){return {id:uid(),kind:"routine",title,area,days,time,minutes,status:"open",doneDates:[],created:Date.now(),touched:Date.now()}}
function Rem(title,area,date,time){return {id:uid(),kind:"reminder",title,area,date,time,status:"open",created:Date.now(),touched:Date.now()}}
function F(title,area,effort,stakes,due,kind="flex",ageDays=0){const c=Date.now()-ageDays*864e5;return {id:uid(),kind,title,area,effort,stakes,due:due||null,status:"open",created:c,touched:c}}
function sampleState(){
  const t=new Date(),d=n=>ymd(addDays(t,n)),ws=ymd(weekStart()),all=[0,1,2,3,4,5,6];
  return normalize({v:1,sample:true,energy:"high",
    settings:{wake:"07:00",sleep:"23:30",peakStart:"09:00",peakEnd:"12:00",bigThree:3,parser:"claude"},
    areas:AREAS0.map(a=>({...a})),
    events:[
      {id:uid(),title:"Calculus lecture",area:"academia",days:[1,3],start:"09:00",end:"10:30",source:"manual"},
      {id:uid(),title:"Thai history seminar",area:"academia",days:[2,4],start:"13:00",end:"15:00",source:"manual"},
      {id:uid(),title:"Football practice",area:"sports",days:[2,4],start:"17:00",end:"19:00",source:"manual"},
      {id:uid(),title:"Volunteer tutoring",area:"social",days:[6],start:"10:00",end:"12:00",source:"manual"},
      {id:uid(),title:"Dinner with friends",area:"people",date:d(2),start:"19:00",end:"21:00",source:"manual"},
      {id:uid(),title:"Art club meet-up",area:"arts",date:d(0),start:"15:00",end:"16:30",source:"manual"},
      {id:uid(),title:"Calculus midterm",area:"academia",date:d(13),start:"09:00",end:"11:00",source:"manual"}],
    tasks:[
      R("Morning routine: shower, skincare","health",all,"07:15",20),
      R("Gym session","sports",[1,3,5],"17:30",60),
      R("Wind down, no screens","health",all,"22:45",20),
      R("Check spending","finance",[0],"20:00",15),
      Rem("Call Mom","people",d(1),"20:30"),
      Rem("Bring student ID for the library","academia",d(3),"08:30"),
      F("Problem set 4: Linear Algebra","academia","L",2,d(2)),
      F("Email Prof. about research assistant role","academia","S",1,d(3)),
      F("Pay phone bill","finance","S",2,d(1)),
      F("Reply to Mint about weekend plans","people","S",0,null),
      F("Outline the social work club proposal","social","M",1,d(5)),
      F("Read chapter 3 for history seminar","academia","M",1,d(4)),
      F("Book badminton court for Saturday","sports","S",0,d(4)),
      F("Follow up with Ben from the hackathon","people","S",0,null,"flex",25),
      F("Sketch session: three figure studies","arts","M",0,null,"growth"),
      F("Japanese: 20 new words","growth","S",0,null,"growth"),
      F("Organise old lecture notes","academia","M",0,null,"flex",30)],
    log:[["academia",900],["sports",300],["health",290],["people",200],["social",120],["finance",30],["growth",50],["arts",0]].map(([a,m])=>({area:a,min:m,date:ws,title:"Earlier this week"}))
  });
}
function normalize(s){
  if(s&&s.sample&&Array.isArray(s.tasks))s.tasks.forEach(t=>{if((t.kind==="flex"||t.kind==="growth")&&!t.cat)t.cat=guessCat(t.title)});
  s=s||{};s.v=1;s.settings=Object.assign({wake:"07:00",sleep:"23:30",peakStart:"09:00",peakEnd:"12:00",bigThree:3,parser:"claude"},s.settings||{});
  s.areas=Array.isArray(s.areas)&&s.areas.length?s.areas:AREAS0.map(a=>({...a}));
  s.tasks=(s.tasks||[]).map(t=>Object.assign({status:"open",stakes:0,effort:"M",kind:"flex",doneDates:[],created:Date.now(),touched:Date.now()},t));
  s.events=(s.events||[]).map(e=>e.created===undefined?{...e,created:0}:e);s.log=s.log||[];s.energy=s.energy||"high";s.focus=s.focus||null;s.gcal=s.gcal||null;s.dayPlan=s.dayPlan||null;s.migrations=s.migrations||[];
  const cutoff=ymd(addDays(new Date(),-56)); s.log=s.log.filter(l=>l.date>=cutoff);
  return s;
}
const area=id=>state.areas.find(a=>a.id===id)||{id,name:id||"Unsorted",target:0};
const TYPE_INFO={event:{name:"Event",g:"Peacock",hex:"#039BE5",colorId:"7"},reminder:{name:"Reminder",g:"Grape",hex:"#8E24AA",colorId:"3"},deadline:{name:"Deadline",g:"Tomato",hex:"#D50000",colorId:"11"},routine:{name:"Routine",g:"Sage",hex:"#33B679",colorId:"2"},task:{name:"Task",g:"Banana",hex:"#F6BF26",colorId:"5"}};
const typeKey=t=>t==="flex"||t==="growth"||!TYPE_INFO[t]?"task":t;
const typeColor=t=>`var(--t-${typeKey(t)})`;
const typeDot=t=>`<span class="dot" style="background:${typeColor(t)}" title="${TYPE_INFO[typeKey(t)].name}"></span>`;
function typeLegend(){return `<div class="legend" aria-label="Colour key">${["event","routine","reminder","task"].map(t=>`<span class="lg"><span class="dot" style="background:${typeColor(t)}"></span>${TYPE_INFO[t].name}s</span>`).join("")}</div>`}
const areaColor=id=>AREAS0.some(a=>a.id===id)?`var(--a-${id})`:"var(--muted)";

/* ---------- persistence ---------- */
function setStatus(){
  const m={cloud:"Saved to your account",local:"Saved in this browser only",memory:"Not saved yet"};
  $("#status").textContent=m[store]||"";
}
function persist(){
  try{localStorage.setItem("compass-one-state",JSON.stringify(state))}catch(e){}
  if(!docRef)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    const body={json:JSON.stringify(state),savedAt:new Date().toISOString()};
    saving=saving.then(()=>docRef.set(body)).then(()=>{store="cloud";setStatus()}).catch(e=>{
      if(e&&e.code==="quota_exceeded")toast("Storage is full. Drop some old tasks in Review.");
      else {store="local";setStatus()}
    });
  },700);
}
function commit(){const n=Date.now();state.events.forEach(e=>{if(e.created===undefined)e.created=n});persist();render()}
async function initStore(){
  try{const raw=localStorage.getItem("compass-one-state");if(raw){state=normalize(JSON.parse(raw));store="local";render()}}catch(e){}
  try{
    const c=window.claude;
    if(c&&typeof c.use==="function"){
      const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
      if(db&&user){
        const id=await user.id();
        if(id){
          docRef=db.doc("data/users/"+id+"/planner");
          const snap=await docRef.get();
          if(snap.exists){const b=snap.data();if(b&&b.json){state=normalize(JSON.parse(b.json))}else if(b&&b.state&&typeof b.state==="object"){state=normalize(b.state)}}
          store="cloud";afterLoad();render();return;
        }
      }
    }
  }catch(e){}
  afterLoad();render();setStatus();
}

/* ---------- scheduling logic ---------- */
function eventsOn(ds){const w=dowOf(ds);return state.events.filter(e=>e.date?e.date===ds:((e.days||[]).includes(w)&&(!e.until||e.until>=ds)&&(!e.from||e.from<=ds)&&!(e.skip||[]).includes(ds)))}
function routinesOn(ds){const w=dowOf(ds);return state.tasks.filter(t=>t.kind==="routine"&&t.status==="open"&&(t.days||[]).includes(w)&&!(t.skip||[]).includes(ds))}
const isWork=t=>t.kind==="flex"||t.kind==="growth";
/* Task timing: an exact length (minutes), an optional fixed slot {date,start,end}, an optional due time */
const durOf=t=>t&&t.fixed&&t.fixed.start&&t.fixed.end?Math.max(5,hm2min(t.fixed.end)-hm2min(t.fixed.start)):(t&&+t.minutes)||EFFORT[t&&t.effort]||45;
const durLabel=t=>{const m=durOf(t);return m<60?m+" min":m%60?Math.floor(m/60)+" h "+m%60+" min":m/60+" h"};
const effortFor=m=>m>=90?"L":m<=20?"S":"M";
const dueText=t=>t.due?dueLabel(t.due)+(t.dueTime?" by "+t.dueTime:""):"";
/* Every item needs High or Low energy. Untagged items get a sensible default until you choose. */
function guessEnergy(type,effort){if(type==="reminder"||type==="routine")return "low";if(type==="event")return "high";return effort==="S"?"low":"high"}
const energyOf=o=>o&&(o.energy==="high"||o.energy==="low")?o.energy:guessEnergy(o&&o.kind?(o.kind==="flex"||o.kind==="growth"?"task":o.kind):"event",o&&o.effort);
function energySegHTML(cur,action,extra){return `<div class="seg sm" role="group" aria-label="Energy this needs">${[["high","High"],["low","Low"]].map(([v,l])=>`<button type="button" data-a="${action}" data-v="${v}" ${extra||""} aria-pressed="${cur===v}">${l}</button>`).join("")}</div>`}
const enBadge=o=>{const e=energyOf(o);return `<span class="en en-${e}">${e} energy</span>`};
function remindersOn(ds){return state.tasks.filter(t=>t.kind==="reminder"&&t.status!=="dropped"&&t.date===ds)}
function deadlinesOn(ds){return state.tasks.filter(t=>isWork(t)&&t.status!=="dropped"&&t.due===ds)}
function openWork(){return state.tasks.filter(t=>isWork(t)&&t.status==="open")}
function activeFocus(){const f=state.focus;return f&&(!f.expires||f.expires>=today())?f:null}
function weekMinutes(areaId){const ws=ymd(weekStart());return state.log.filter(l=>l.area===areaId&&l.date>=ws).reduce((a,l)=>a+l.min,0)}
function areaPace(areaId){
  const a=area(areaId);if(!a.target)return 1;
  const dayIdx=((new Date().getDay()+6)%7)+1;
  const expected=a.target*60*(dayIdx/7);
  return weekMinutes(areaId)/Math.max(30,expected);
}
function inPeak(){const m=nowMin();return m>=hm2min(state.settings.peakStart)&&m<hm2min(state.settings.peakEnd)}
/* What's around you right now: a demanding event, routine or reminder that just ended or is about to start.
   Recomputed at most once a minute. */
let ctxCache={k:"",v:null};
function energyContext(){
  const ds=today(),m=nowMin(),k=ds+"|"+m+"|"+state.events.length+"|"+state.tasks.length;
  if(ctxCache.k===k)return ctxCache.v;
  const fixed=[...eventsOn(ds).map(e=>({o:e,s:hm2min(e.start),e:hm2min(e.end)})),
    ...routinesOn(ds).map(r=>({o:r,s:hm2min(r.time),e:hm2min(r.time)+(r.minutes||15)})),
    ...remindersOn(ds).filter(r=>r.status==="open").map(r=>({o:r,s:hm2min(r.time),e:hm2min(r.time)}))];
  const hi=fixed.filter(x=>energyOf(x.o)==="high");
  const after=hi.filter(x=>x.e<=m&&m-x.e<=60).sort((a,b)=>b.e-a.e)[0];
  const during=hi.find(x=>x.s<=m&&m<x.e);
  const before=hi.filter(x=>x.s>m&&x.s-m<=60).sort((a,b)=>a.s-b.s)[0];
  const lowNext=fixed.filter(x=>energyOf(x.o)==="low"&&x.s>m&&x.s-m<=60).sort((a,b)=>a.s-b.s)[0];
  const v=after?{mode:"recover",why:`Easing off after ${after.o.title}`}:during?{mode:"recover",why:`For after ${during.o.title}`}:before?{mode:"save",why:`Saving energy for ${before.o.title}`}:lowNext&&state.energy==="high"?{mode:"push",why:`Use your energy before ${lowNext.o.title}`}:null;
  ctxCache={k,v};return v;
}
/* ---------- task categories: School first, then Extracurricular, then Personal ---------- */
const CATS=[["school","School"],["extra","Extracurricular"],["personal","Personal"]];
const CAT_RANK={school:0,extra:1,personal:2};const CAT_PTS=CAT_RANK; /* kept name: membership check only */
const catName=c=>(CATS.find(x=>x[0]===c)||[null,"No category"])[1];
function guessCat(title){
  const s=String(title||"").toLowerCase();
  if(/\b(class|course|lecture|homework|hw|assignment|essay|exam|midterm|final|quiz|thesis|seminar|professor|prof|dr|ajarn|study|problem set|reading|report|paper|lab|tutorial|module|materials|chapter|grade|points|syllabus|uni|university|faculty)\b/.test(s))return "school";

/* "/" separates items when listing many. A slash is NOT a separator when it is part of

function splitSlashes(text){

    const prev=text.slice(0,i),next=text.slice(i+1),tok=(prev.match(/\S*$/)||[""])[0];

      ||(/(?:^|[^a-z])(?:mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun)(?:day)?s?$/i.test(prev)&&/^(?:mon|tue|wed|thu|fri|sat|sun)/i.test(next))
      ||(/\band$/i.test(prev)&&/^or\b/i.test(next))
      ||/(?:^|\s)w$/i.test(prev)
      ||/[a-z]:$|:\/$|\.[a-z]{2,}(?:\/\S*)?$/i.test(tok)||(tok.includes("://"))
      ||next.startsWith("/")||/\/$/.test(prev)&&false;
    if(keep){cur+=ch;continue}

  f+=`<label class="fld" for="ef-note">Note (optional)<input type="text" id="ef-note" data-ef="note" value="${esc(d.note)}" maxlength="200" placeholder="Room, link, what to bring…"></label>
    ${calEdit.src==="ics"?`<p class="note">This came from your calendar import. Re-importing will replace your edits.</p>`:""}
    ${calEdit.err?`<p class="err" role="alert">${esc(calEdit.err)}</p>`:""}
    ${calEdit.confirm?`<div class="banner"><span>${esc(delQ)}</span><span class="row"><button class="btn sm" data-a="efNoDel">Keep it</button><button class="btn sm needle" data-a="efDel">${esc(delLabel)}</button></span></div>`
      :`<div class="row between"><span class="row"><button class="btn primary" data-a="efSave">Save</button><button class="btn" data-a="efCancel">Cancel</button></span>${changed?"":`<button class="btn ghost" data-a="efAskDel">${esc(delLabel)}</button>`}</div>`}
  </div>`;
  return f;
}
/* one-day override of a weekly event: skip that date on the series, add a one-off copy */
function overrideOccurrence(series,occ,fields){
  series.skip=[...new Set([...(series.skip||[]),occ])];
  const o={id:uid(),title:series.title,area:series.area,energy:series.energy,start:series.start,end:series.end,note:series.note||"",source:series.source==="ics"?"ics":"manual",parent:series.id,occ,date:occ,...fields};
  state.events.push(o);return o;
}
function saveConvert(){
  const {id,k,origK,d}=calEdit;
  const err=m=>{calEdit.err=m;render()};
  const title=String(d.title||"").trim().slice(0,80);if(!title)return err("Give it a title.");
  if((k==="task"||k==="deadline")&&!CAT_RANK.hasOwnProperty(d.cat))return err("Choose a category: School, Extracurricular or Personal.");
  const note=String(d.note||"").trim().slice(0,200);
  if(k==="event"){
    if(!d.start||!d.end||hm2min(d.end)<=hm2min(d.start))return err("The end time needs to be after the start time.");
    if(d.repeat&&!(d.days&&d.days.length))return err("Pick at least one day.");
    if(!d.repeat&&!d.date)return err("Pick a date.");
  }
  if(k==="reminder"&&(!d.date||!d.time))return err("A reminder needs a date and a time.");
  if(k==="deadline"||k==="task"){const te=timingError(d,k);if(te)return err(te)}
  if(k==="routine"&&(!(d.days&&d.days.length)||!d.time))return err("Pick at least one day and a time.");
  const snap=snapshot();
  /* remove the old item */
  if(origK==="event"){state.events=state.events.filter(x=>x.id!==id&&x.parent!==id)}
  else removeTask(id);
  /* add the new one */
  let moved=null,n;
  if(k==="event"){n={id:uid(),title,area:d.area,start:d.start,end:d.end,note,source:"manual"};if(d.repeat){n.days=d.days.slice();n.from=today();if(d.until)n.until=d.until}else{n.date=d.date;moved=d.date}state.events.push(n)}
  else if(k==="reminder"){n=Rem(title,d.area,d.date,d.time);n.note=note;state.tasks.push(n);moved=d.date}
  else if(k==="deadline"){n=F(title,d.area,d.effort||"M",+d.stakes||0,d.due);n.note=note;n.cat=d.cat;applyTiming(n,d);state.tasks.push(n);moved=d.mode==="set"?d.fdate:d.due}
  else if(k==="routine"){n=R(title,d.area,d.days.slice(),d.time,Math.min(240,Math.max(5,Math.round(+d.minutes)||30)));n.note=note;state.tasks.push(n)}
  else{n=F(title,d.area,d.effort||"M",+d.stakes||0,null);n.note=note;n.cat=d.cat;applyTiming(n,d);state.tasks.push(n);if(d.mode==="set")moved=d.fdate}
  if(d.energy)n.energy=d.energy;
  calEdit=null;
  if(moved&&moved!==calSel){calSel=moved;const dt=new Date(moved+"T12:00");calJump(dt)}
  const art={event:"an event",reminder:"a reminder",deadline:"a deadline",routine:"a routine",task:"an undated task"}[k];
  toast(`Changed to ${art}.`,"Undo",()=>restore(snap));
  commit();
}
function saveEdit(){
  if(calEdit&&calEdit.k!==calEdit.origK)return saveConvert();
  const {id,k,d,recurring,scope,occ}=calEdit,one=recurring&&scope==="one";
  const o=k==="event"?state.events.find(e=>e.id===id):state.tasks.find(t=>t.id===id);if(!o){calEdit=null;render();return}
  const err=m=>{calEdit.err=m;render()};
  const title=String(d.title||"").trim();if(!title)return err("Give it a title.");
  if((k==="task"||k==="deadline")&&!CAT_RANK.hasOwnProperty(d.cat))return err("Choose a category: School, Extracurricular or Personal.");
  if(k==="event"){
    if(!d.start||!d.end||hm2min(d.end)<=hm2min(d.start))return err("The end time needs to be after the start time.");
    if(!one&&d.repeat&&!d.days.length)return err("Pick at least one day.");
    if((one||!d.repeat)&&!d.date)return err("Pick a date.");
    if(!one&&d.repeat&&d.until&&d.until<today())return err("The end date is in the past.");
  }
  if(k==="reminder"&&(!d.date||!d.time))return err("A reminder needs a date and a time.");
  if(k==="deadline"||k==="task"){const te=timingError(d,k);if(te)return err(te)}
  if(k==="routine"&&(!d.time||(!one&&!d.days.length)))return err("Pick at least one day and a time.");
  const note=String(d.note||"").trim().slice(0,200);
  let moved=null;
  if(one&&k==="event"){
    overrideOccurrence(o,occ,{title:title.slice(0,80),area:d.area,start:d.start,end:d.end,note,date:d.date,energy:d.energy||undefined});
    moved=d.date;
  }else if(one&&k==="routine"){
    /* a routine changed for one day becomes a one-off event on that day */
    o.skip=[...new Set([...(o.skip||[]),occ])];
    state.events.push({id:uid(),title:title.slice(0,80),area:d.area,date:occ,start:d.time,end:min2hm(Math.min(hm2min(d.time)+(Math.round(+d.minutes)||30),1439)),note,source:"manual",fromRoutine:o.id});
  }else{
    o.title=title.slice(0,80);o.area=d.area;o.note=note;o.touched=Date.now();o.energy=d.energy==="low"?"low":"high";
    if(k==="event"){o.start=d.start;o.end=d.end;
      if(d.repeat){o.days=d.days.slice();delete o.date;o.until=d.until||null;if(!o.from)o.from=today()}
      else{o.date=d.date;delete o.days;delete o.until;delete o.from;delete o.skip;moved=d.date}}
    else if(k==="reminder"){o.date=d.date;o.time=d.time;o.status=d.done?"done":"open";moved=d.date}
    else if(k==="deadline"){applyTiming(o,d);o.cat=d.cat;o.stakes=+d.stakes||0;if(!d.done&&o.status==="done")reopenTask(o);else if(d.done&&o.status!=="done"){o.status="done";o.doneAt=Date.now()}o.pin=false;moved=d.mode==="set"?d.fdate:d.due}
    else if(k==="task"){applyTiming(o,d);o.cat=d.cat;o.stakes=+d.stakes||0;if(!d.done&&o.status==="done")reopenTask(o);else if(d.done&&o.status!=="done"){o.status="done";o.doneAt=Date.now()}if(d.mode==="set")moved=d.fdate;else if(d.due)moved=d.due}
    else{o.days=d.days.slice();o.time=d.time;o.minutes=Math.min(240,Math.max(5,Math.round(+d.minutes)||30))}
  }
  calEdit=null;
  if(moved&&moved!==calSel){calSel=moved;const dt=new Date(moved+"T12:00");calJump(dt);toast("Saved and moved to "+fmtDate(moved)+".")}
  else toast(one?"Saved for "+fmtDate(occ)+" only.":"Saved.");
  commit();
}
function deleteEdit(){
  const {k,id,recurring,scope,occ}=calEdit,one=recurring&&scope==="one";
  const snap=snapshot();
  if(one){const s=k==="event"?state.events.find(e=>e.id===id):state.tasks.find(t=>t.id===id);if(s)s.skip=[...new Set([...(s.skip||[]),occ])]}
  else if(k==="event"){
    const ev=state.events.find(e=>e.id===id);
    state.events=state.events.filter(x=>x.id!==id&&x.parent!==id);
    if(ev&&ev.parent){const p=state.events.find(e=>e.id===ev.parent);if(p&&ev.occ&&!(p.skip||[]).includes(ev.occ))p.skip=[...(p.skip||[]),ev.occ]}
  }else removeTask(id);
  calEdit=null;toast(one?"Removed for "+fmtDate(occ)+" only.":"Removed.","Undo",()=>restore(snap));commit();
}
function restoreOccurrence(){
  const ev=state.events.find(e=>e.id===calEdit.id);if(!ev)return;
  const p=state.events.find(e=>e.id===ev.parent);
  if(p)p.skip=(p.skip||[]).filter(x=>x!==ev.occ);
  state.events=state.events.filter(e=>e.id!==ev.id);
  if(ev.occ&&ev.occ!==calSel){calSel=ev.occ;const dt=new Date(ev.occ+"T12:00");calJump(dt)}
  calEdit=null;toast("Back to the weekly version.");commit();
}
const snapshot=()=>JSON.stringify({events:state.events,tasks:state.tasks,dayPlan:state.dayPlan});
function restore(snap){const o=JSON.parse(snap);state.events=o.events;state.tasks=o.tasks;if("dayPlan" in o)state.dayPlan=o.dayPlan;calEdit=null;toast("Undone.");commit()}

/* ---------- drag to move (mouse, pen and touch) ---------- */
let drag=null,suppressClick=false;
/* ---------- elastic scroll in calendar day boxes ----------
   Wheel/trackpad (or dragging the empty part of a box) pulls the day's list up so you can read to the bottom.
   It stays stretched while you hold it: for wheel/trackpad, until the pointer leaves that day's box (browsers
   can't tell when fingers lift off a trackpad); for a mouse pull, until the button is released.
   Then it springs back to the top, like a stretched elastic band contracting. */
function markOverflow(){document.querySelectorAll(".cal .ents").forEach(el=>{const inner=el.firstElementChild;el.classList.toggle("more-below",!!inner&&inner.scrollHeight>el.clientHeight+2)})}
const elastic={el:null,raw:0,timer:null};
function elMax(el){const inner=el.firstElementChild;return Math.max(0,inner.scrollHeight-el.clientHeight+6)}
function elShow(el,raw){
  const max=elMax(el),inner=el.firstElementChild;
  let y=raw;
  if(raw<0)y=-Math.min(30,Math.pow(-raw,.7));                 /* a little give above the top */
  else if(raw>max)y=max+Math.min(40,Math.pow(raw-max,.7));     /* resistance past the bottom */
  inner.classList.remove("snap");inner.style.transform=`translateY(${-y}px)`;el.classList.add("stretching");
}
function elRelease(el){
  if(!el)return;const inner=el.firstElementChild;
  inner.classList.add("snap");inner.style.transform="translateY(0)";el.classList.remove("stretching","grabbing");
  if(elastic.el===el){elastic.el=null;elastic.raw=0}
}
document.addEventListener("wheel",e=>{
  const el=e.target.closest&&e.target.closest(".cal .ents");if(!el||elMax(el)<=6||Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
  e.preventDefault();
  if(elastic.el&&elastic.el!==el)elRelease(elastic.el);
  if(elastic.el!==el){elastic.el=el;elastic.raw=0}
  const step=e.deltaMode===1?e.deltaY*18:e.deltaY;
  elastic.raw=Math.max(-60,Math.min(elMax(el)+90,elastic.raw+step));
  elShow(el,elastic.raw);
  /* pulled past either end: ease back to that end once the wheel pauses, but keep holding the list there */
  clearTimeout(elastic.timer);elastic.timer=setTimeout(()=>{if(elastic.el!==el)return;const max=elMax(el),c=Math.max(0,Math.min(max,elastic.raw));
    if(c!==elastic.raw){elastic.raw=c;const inner=el.firstElementChild;inner.classList.add("snap");inner.style.transform=`translateY(${-c}px)`}},160);
},{passive:false});
let elPull=null;
document.addEventListener("pointerdown",e=>{
  if(e.button>0||e.pointerType==="touch")return;
  const el=e.target.closest&&e.target.closest(".cal .ents");if(!el||e.target.closest("[data-drag]")||elMax(el)<=6)return;
  if(elastic.el&&elastic.el!==el)elRelease(elastic.el);
  elPull={el,y0:e.clientY,pid:e.pointerId,moved:false};
});
document.addEventListener("pointermove",e=>{
  if(!elPull||e.pointerId!==elPull.pid)return;
  const dy=elPull.y0-e.clientY;if(!elPull.moved&&Math.abs(dy)<4)return;
  elPull.moved=true;elPull.el.classList.add("grabbing");elastic.el=elPull.el;elastic.raw=dy*1.2;elShow(elPull.el,elastic.raw);
});
const elEnd=e=>{if(!elPull||e.pointerId!==elPull.pid)return;const p=elPull;elPull=null;
  if(p.moved){suppressClick=true;setTimeout(()=>suppressClick=false,0);elRelease(p.el)}};
document.addEventListener("pointerup",elEnd);
/* letting go of a wheel/trackpad stretch = moving the pointer out of that day's box, pressing elsewhere, or leaving the window */
document.addEventListener("pointermove",e=>{if(!elastic.el||elPull)return;const day=elastic.el.closest(".day");if(!day||!day.isConnected){elastic.el=null;return}
  const r=day.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)elRelease(elastic.el)});
document.addEventListener("pointerdown",e=>{if(elastic.el&&!elPull&&!(e.target.closest&&e.target.closest(".day")===elastic.el.closest(".day")))elRelease(elastic.el)},true);
document.addEventListener("mouseleave",()=>{if(elastic.el&&!elPull)elRelease(elastic.el)});
window.addEventListener("blur",()=>{if(elastic.el)elRelease(elastic.el)});document.addEventListener("pointercancel",elEnd);
window.addEventListener("resize",()=>markOverflow());

function moveItem(k,id,from,to){
  if(!to||to===from)return;
  const snap=snapshot();let msg;
  if(k==="event"){
    const e=state.events.find(x=>x.id===id);if(!e)return;
    if(e.days&&e.days.length){overrideOccurrence(e,from,{date:to});msg=`Moved ${fmtDate(from)}'s ${e.title} to ${fmtDate(to)}. Other weeks stay put.`}
    else{e.date=to;msg=`Moved ${e.title} to ${fmtDate(to)}.`}
  }else{
    const t=state.tasks.find(x=>x.id===id);if(!t)return;
    if(k==="reminder")t.date=to;else if(k==="due"||k==="deadline"){t.due=to;t.pin=false}else return;
    t.touched=Date.now();msg=`Moved ${t.title} to ${fmtDate(to)}.`;
  }
  calEdit=null;calSel=to;const dt=new Date(to+"T12:00");calJump(dt);
  toast(msg,"Undo",()=>restore(snap));commit();
}
function endDrag(drop){
  if(!drag)return;
  const d=drag;drag=null;
  if(d.ghost)d.ghost.remove();
  document.body.classList.remove("dragging");
  document.querySelectorAll(".cal .day.droptarget").forEach(c=>c.classList.remove("droptarget"));
  cancelAnimationFrame(d.raf);
  if(d.started){suppressClick=true;setTimeout(()=>suppressClick=false,0);if(drop&&d.target)moveItem(d.k,d.id,d.from,d.target)}
}
function dragScroll(){
  if(!drag||!drag.started)return;
  const y=drag.y,h=window.innerHeight;
  if(y<70)window.scrollBy(0,-Math.ceil((70-y)/5));else if(y>h-70)window.scrollBy(0,Math.ceil((y-(h-70))/5));
  updateTarget();drag.raf=requestAnimationFrame(dragScroll);
}
function updateTarget(){
  const el=document.elementFromPoint(drag.x,drag.y),cell=el&&el.closest(".cal .day");
  const t=cell?cell.dataset.v:null;
  if(t!==drag.target){document.querySelectorAll(".cal .day.droptarget").forEach(c=>c.classList.remove("droptarget"));if(cell&&t!==drag.from)cell.classList.add("droptarget");drag.target=t}
}
document.addEventListener("pointerdown",e=>{
  const h=e.target.closest("[data-drag]");if(!h||e.button>0)return;
  drag={k:h.dataset.k,id:h.dataset.id,from:h.dataset.from,title:h.dataset.title,x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,started:false,target:null,pid:e.pointerId,touch:e.pointerType==="touch"};
});
document.addEventListener("pointermove",e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  drag.x=e.clientX;drag.y=e.clientY;
  if(!drag.started){
    if(Math.hypot(drag.x-drag.x0,drag.y-drag.y0)<6)return;
    drag.started=true;document.body.classList.add("dragging");
    const g=document.createElement("div");g.className="dragghost";g.textContent=drag.title;document.body.appendChild(g);drag.ghost=g;
    drag.raf=requestAnimationFrame(dragScroll);
  }
  e.preventDefault();
  drag.ghost.style.transform=`translate(${drag.x+12}px,${drag.y+12}px)`;
  updateTarget();
},{passive:false});
document.addEventListener("pointerup",e=>{if(drag&&e.pointerId===drag.pid)endDrag(true)});
document.addEventListener("pointercancel",()=>endDrag(false));
document.addEventListener("keydown",e=>{if(drag&&drag.started&&e.key==="Escape")endDrag(false)});

function areaTable(){
  let h=`<div>`;
  state.areas.forEach(a=>{
    const w=weekMinutes(a.id),pct=a.target?Math.min(100,w/(a.target*60)*100):0,pace=areaPace(a.id);
    const c=pace<.6?"var(--needle)":pace<.9?"var(--warn)":"var(--good)";
    h+=`<div class="area-row"><div class="row" style="flex-wrap:nowrap;min-width:0">${areaDot(a.id)}<span style="overflow-wrap:anywhere">${esc(a.name)}</span></div>
    <div style="display:grid;gap:4px;min-width:0"><div class="meter"><i style="width:${pct}%;background:${areaColor(a.id)}"></i></div><span class="nums"><span style="color:${c}">●</span> ${fmtHrs(w)} of <input type="number" min="0" max="80" step="1" value="${a.target}" data-a="target" data-id="${a.id}" aria-label="${esc(a.name)} weekly target in hours" style="width:58px;padding:2px 6px;font-size:12.5px"> h</span></div>
    <button class="btn sm" data-a="log30" data-id="${a.id}">+30m</button></div>`;
  });
  return h+`</div>`;
}

function capacity(extraMinPerWeek=0,weeks=2){
  const days=14,st=state.settings;let awake=0,committed=0;const scheduled={};
  for(let i=0;i<days;i++){const ds=ymd(addDays(new Date(),i));awake+=hm2min(st.sleep)-hm2min(st.wake);
    blocksOn(ds).forEach(b=>{committed+=b.end-b.start;scheduled[b.area]=(scheduled[b.area]||0)+(b.end-b.start)})}
  const tasks=openWork().reduce((a,t)=>a+(EFFORT[t.effort]||45),0);
  const targets=state.areas.reduce((a,ar)=>a+Math.max(0,ar.target*60*2-(scheduled[ar.id]||0)),0);
  const extra=extraMinPerWeek*Math.min(2,weeks);
  const load=committed+tasks+targets+extra;
  return {awake,committed,tasks,targets,extra,load,pct:load/awake*100};
}
function capBar(c){const col=c.pct<75?"var(--good)":c.pct<90?"var(--warn)":"var(--needle)";return `<div class="cap" aria-hidden="true"><i style="width:${Math.min(100,c.pct)}%;background:${col}"></i><span class="m" style="left:75%"></span><span class="m" style="left:90%"></span></div>`}
function verdict(p){return p<75?["Room to say yes","good"]:p<90?["Tight. Say yes only if something else goes","warm"]:["Overbooked. Say no or drop something first","hot"]}
function viewReview(){
  const tri=state.tasks.filter(t=>t.triage&&t.status==="open");
  const stale=state.tasks.filter(t=>isWork(t)&&t.status==="open"&&(Date.now()-t.touched)/864e5>21);
  const behind=state.areas.filter(a=>a.target&&areaPace(a.id)<.6);
  const c=capacity(),[vt,vc]=verdict(c.pct);
  let h=`<div><div class="eyebrow">About 15 minutes, once a week</div><h2>Weekly reset</h2></div>`;
  h+=`<div class="panel"><div class="row between"><h3>1. Sort what you captured</h3><span class="nums">${tri.length}</span></div>${tri.length?`<div class="list">${tri.map(t=>`<div class="li" style="grid-template-columns:1fr">
    <div class="txt"><b>${esc(t.title)}</b></div>
    <div class="row">${chipsFor(t,"area",state.areas.map(a=>[a.id,a.name]))}</div>
    <div class="row">${chipsFor(t,"effort",[["S","15m"],["M","45m"],["L","90m"]])}<span class="muted small">·</span>${chipsFor(t,"stakes",STAKES.map((s,i)=>[i,s]))}<button class="btn sm primary" data-a="sorted" data-id="${t.id}">Sorted</button></div></div>`).join("")}</div>`:`<p class="small muted" style="margin:0">Inbox is empty.</p>`}</div>`;

  h+=`<div class="panel"><h3>3. Check your balance</h3>${behind.length?`<p style="margin:0">Behind pace this week: ${behind.map(a=>`<span class="tag hot">${esc(a.name)}</span>`).join(" ")}</p><p class="small muted" style="margin:0">Compass is already ranking these areas' tasks higher. If an area has no tasks at all, add one small one now, or lower its weekly target below.</p>`:`<p class="small muted" style="margin:0">Every area is on pace.</p>`}${areaTable()}<p class="small muted" style="margin:0">Edit a target to change how much time an area should get each week. Tap +30m to log time you didn't track.</p></div>`;
  h+=`<div class="panel"><div class="row between"><h3>4. Next two weeks</h3><span class="tag ${vc}">${esc(vt)}</span></div>
    <div class="row between"><span class="big-num">${Math.round(c.pct)}%</span><span class="small muted">of your waking hours spoken for</span></div>${capBar(c)}
    <div class="small muted">${fmtHrs(c.committed)} events and routines · ${fmtHrs(c.tasks)} open tasks · ${fmtHrs(c.targets)} still needed for area targets · ${fmtHrs(c.awake)} awake</div></div>`;
  h+=`<div class="panel"><h3>Can I say yes?</h3><p class="small muted" style="margin:0">Before you accept a new role, club or project, enter what it would cost.</p>
    <div class="row"><label class="fld" for="y-h">Hours per week<input type="number" id="y-h" min="0" max="60" step="1" value="4" style="width:110px"></label><button class="btn primary" data-a="canYes" style="align-self:end">Check</button></div><div id="yesOut"></div></div>`;

function parseICS(text){

  out.forEach(e=>{
    if(!e.s||e.s.allDay||!e.e||e.e.allDay)return;
    const base={id:uid(),title:e.title||"Busy",area:guessArea(e.title||""),start:e.s.hm,end:e.e.ds!==e.s.ds?"23:59":e.e.hm,source:"ics"};
    if(hm2min(base.end)<=hm2min(base.start))return;
    if(e.rr){
      const f=(e.rr.match(/FREQ=(\w+)/)||[])[1];
      const until=(e.rr.match(/UNTIL=(\d{8})/)||[])[1];
      const u=until?`${until.slice(0,4)}-${until.slice(4,6)}-${until.slice(6,8)}`:null;
      if(u&&u<t)return;
      if(f==="WEEKLY"||f==="DAILY"){
        const by=(e.rr.match(/BYDAY=([A-Z,0-9-]+)/)||[])[1];
        const days=f==="DAILY"?[0,1,2,3,4,5,6]:by?by.split(",").map(x=>map[x.slice(-2)]).filter(x=>x!=null):[dowOf(e.s.ds)];
        evs.push({...base,days,from:e.s.ds,until:u});return;
      }
    }
    if(e.s.ds>=past&&e.s.ds<=horizon)evs.push({...base,date:e.s.ds});
  });
  return evs;
}
function guessArea(t,dflt="people"){
  const s=t.toLowerCase();
  const rules=[["academia",/lecture|class|seminar|exam|lab|tutorial|study|thesis|quiz|midterm|final|office hours/],["sports",/practice|training|gym|match|football|run|swim|badminton|tennis|basket|game/],["arts",/art|music|concert|museum|gallery|rehearsal|theatre|theater|dance|film/],["social",/volunteer|charity|community|ngo|club meeting/],["finance",/bank|pay|rent|bill|tax/],["health",/doctor|dentist|clinic|haircut|therapy|stretch|yoga|meditat|laundry|clean|groceries|shower|skincare|sleep|cook/],["people",/dinner|lunch|coffee|party|birthday|drinks|hangout|meet|\bmom\b|\bdad\b|mum|family|friend|call |text /]];
  for(const[a,re]of rules)if(re.test(s))return a;
  return dflt;
}
function buildICS(mode){
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const fmt=m=>pad(Math.floor(m/60))+pad(m%60)+"00";
  const tx=t=>String(t).replace(/[\\,;]/g,m=>"\\"+m);
  const ve=(uidv,ds,st,en,title,ar,alarm)=>["BEGIN:VEVENT","UID:"+uidv+"@compass","DTSTAMP:"+stamp,"DTSTART:"+ds+"T"+fmt(st),"DTEND:"+ds+"T"+fmt(en),"SUMMARY:"+tx(title),...(alarm?["BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+tx(title),"TRIGGER:PT0M","END:VALARM"]:[]),"END:VEVENT"].join("\r\n");
  const out=[];let n=0;
  if(mode==="today"){
    const ds=today().replace(/-/g,"");
    planToday().placed.filter(p=>!p.dropped).forEach(p=>{out.push(ve(p.ref.id+"-"+ds,ds,p.start,p.end,(p.big?"★ ":"")+p.title,p.area));n++});
  }else{
    for(let i=0;i<30;i++){
      const d=ymd(addDays(new Date(),i)),ds=d.replace(/-/g,"");
      eventsOn(d).filter(e=>e.source!=="ics").forEach(e=>{out.push(ve(e.id+"-"+ds,ds,hm2min(e.start),hm2min(e.end),e.title,e.area));n++});
      remindersOn(d).filter(r=>r.status==="open").forEach(r=>{const m=hm2min(r.time);out.push(ve(r.id,ds,m,m+15,"Reminder: "+r.title,r.area,true));n++});
      deadlinesOn(d).filter(t=>t.status==="open").forEach(t=>{const nx=ymd(addDays(new Date(d+"T12:00"),1)).replace(/-/g,"");out.push(["BEGIN:VEVENT","UID:"+t.id+"-due@compass","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+ds,"DTEND;VALUE=DATE:"+nx,"SUMMARY:"+tx("Due: "+t.title),"END:VEVENT"].join("\r\n"));n++});
    }
  }
  return {n,text:["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Compass//Planner//EN","CALSCALE:GREGORIAN",...out,"END:VCALENDAR"].join("\r\n")};
}

    if(f==="minutes"){const m=Math.min(600,Math.max(5,Math.round(+v)||45));x.minutes=m;x.effort=effortFor(m);if(x.fstart){x.fend=min2hm(Math.min(hm2min(x.fstart)+m,1439))}}
    else if(f==="fstart"){x.fstart=v||null;if(v&&!x.fend)x.fend=min2hm(Math.min(hm2min(v)+durOf(x),1439));if(v&&!x.fdate)x.fdate=x.due&&x.due>=today()?x.due:(describe.ctxDate||today())}
    else if(f==="fend"){x.fend=v||null}
    else if(f==="fdate"){x.fdate=v||null;if(v&&!x.fstart){x.fstart="09:00";x.fend=min2hm(Math.min(540+durOf(x),1439))}}
    else if(f==="due"){x.due=v||null;x.type="task";if(!v)delete x.dueTime}
    else if(f==="dueTime"){x.dueTime=v||null}
    else if(f==="date"){if(v)x.date=v}
    else if(f==="start"){if(v){const len=Math.max(15,hm2min(x.end)-hm2min(x.start))||60;x.start=v;x.end=min2hm(Math.min(hm2min(v)+len,1439))}}
    else if(f==="end"){if(v&&hm2min(v)>hm2min(x.start))x.end=v}
    else if(f==="time"){if(v)x.time=v}
    if(["date","start","end","time","due","dueTime","fdate","fstart","fend"].includes(f)){x.guess=[];x.src=x.src?x.src+" · changed by you":"changed by you"}
    if(x.fstart&&x.fend&&hm2min(x.fend)<=hm2min(x.fstart))x.fend=min2hm(Math.min(hm2min(x.fstart)+durOf({minutes:x.minutes,effort:x.effort}),1439));
    if(!x.fstart||!x.fend){delete x.fstart;delete x.fend;if(f!=="fdate")delete x.fdate}
    else if(x.fstart&&x.fend)x.minutes=Math.max(5,hm2min(x.fend)-hm2min(x.fstart));
    render();return}
  if(calEdit&&el.dataset&&el.dataset.ef){calEdit.d[el.dataset.ef]=el.type==="checkbox"?el.checked:el.value;if(el.dataset.ef==="area")render();return}
  if(el.dataset.a==="target"){const a=state.areas.find(x=>x.id===el.dataset.id);if(a){a.target=Math.max(0,+el.value||0);commit()}}
  else if(el.dataset.s){state.settings[el.dataset.s]=el.dataset.s==="bigThree"?Math.min(5,Math.max(1,+el.value||3)):el.value;commit()}
  else if(el.id==="f-due"){draft.due=el.value||null;const t=$("#f-title");if(t)draft.title=t.value;render()}
  else if(el.id==="icsFile"&&el.files&&el.files[0]){
    const r=new FileReader();
    r.onload=()=>{try{const evs=parseICS(String(r.result));state.events=state.events.filter(x=>x.source!=="ics").concat(evs);commit();toast(evs.length?`Imported ${evs.length} event${evs.length>1?"s":""}.`:"No timed events found in that file.")}catch(err){toast("That file couldn't be read as a calendar.")}};
    r.readAsText(el.files[0]);
  }
});
let noteTimer=null;
document.addEventListener("input",e=>{const el=e.target;if(!el.dataset||!el.dataset.noteId)return;
  const t=state.tasks.find(x=>x.id===el.dataset.noteId);if(!t)return;
  t.note=el.value.slice(0,200);t.touched=Date.now();
  const box=el.closest(".task-note"),cnt=box&&box.querySelector(".task-note-count"),st=box&&box.querySelector(".task-note-state");

document.addEventListener("input",e=>{if(calEdit&&e.target.dataset&&e.target.dataset.ef&&e.target.type!=="checkbox"){const f=e.target.dataset.ef,d=calEdit.d;
  if(f==="fstart"&&d.fstart&&d.fend&&e.target.value){const dur=Math.max(5,hm2min(d.fend)-hm2min(d.fstart));d.fend=min2hm(Math.min(hm2min(e.target.value)+dur,1439));const en=$("#ef-fend");if(en)en.value=d.fend}
  if(f==="start"&&d.start&&d.end&&e.target.value){const dur=Math.max(15,hm2min(d.end)-hm2min(d.start));d.end=min2hm(Math.min(hm2min(e.target.value)+dur,1439));const en=$("#ef-end");if(en)en.value=d.end}
  d[f]=e.target.value;return}const id=e.target.id;if(id==="f-title")draft.title=e.target.value;else if(id==="ask-desc"){describe.text=e.target.value;const sh=$("#seg-hint");if(sh)sh.textContent=segHint(describe.text)}else if(id==="ask-focus")focusUI.text=e.target.value});
document.addEventListener("toggle",e=>{if(e.target.id==="manualBox")draft.open=e.target.open},true);
async function initAI(){try{const c=window.claude;if(c&&typeof c.use==="function"){ai=await c.use("sample")}}catch(e){ai=null}if(ai&&!document.activeElement.matches("input,textarea"))render()}

setInterval(()=>{
  if(timer){const el=$("#timerTxt");const t=state.tasks.find(x=>x.id===timer.id);if(el&&t){const left=timer.mins*60-(Date.now()-timer.start)/1000,a=Math.abs(left);el.textContent=(left<0?"+":"")+pad(Math.floor(a/60))+":"+pad(Math.floor(a%60));el.style.color=left<0?"var(--needle)":""}}
},1000);

/* ---------- Chat: questions about what's coming up, answered only from the planner and the user's own notes ---------- */
let chatUI={busy:false,ctl:null,partial:"",error:"",kbOpen:false,headSig:"",logSig:""};
const CHAT_MAX=40;
const SUGGEST=["What's on today?","What's due this week?","When are my final exams?","Am I free tomorrow afternoon?","What should I work on next?"];
function chatList(){if(!Array.isArray(state.chat))state.chat=[];return state.chat}
function chatTrim(){const L=chatList();if(L.length>CHAT_MAX)L.splice(0,L.length-CHAT_MAX)}
const shortDate=ds=>new Date(ds+"T12:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
function itemText(x){
  const o=x.ref||{},nt=o.note?` (note: ${String(o.note).slice(0,140)})`:"",dn=x.done?" [done]":x.dropped?" [dropped]":"";
  if(x.type==="event")return `${min2hm(x.start)}–${min2hm(x.end)} event: ${x.title}${o.days&&o.days.length?" (weekly)":""}${nt}`;
  if(x.type==="routine")return `${min2hm(x.start)} routine: ${x.title} (${o.minutes||15} min)${dn}`;
  if(x.type==="reminder")return `${min2hm(x.start)} reminder: ${x.title}${dn}${nt}`;
  if(x.dueMarker)return `DUE: task "${x.title}"${o.dueTime?" by "+o.dueTime:""}, ${STAKES[o.stakes||0].toLowerCase()} if missed${dn}${nt}`;
  if(x.finished)return `${min2hm(x.start)} finished task: ${x.title}`;
  return `${min2hm(x.start)}–${min2hm(x.end)} task (${o.fixed?"set time":"planned slot"}): ${x.title}${dn}${nt}`;
}
function agendaText(from,to){
  let a=new Date(String(from)+"T12:00"),b=new Date(String(to)+"T12:00");if(isNaN(a)||isNaN(b))return "Dates must be YYYY-MM-DD.";
  if(b<a)[a,b]=[b,a];const out=[],t=today();let n=0;
  for(let d=new Date(a);d<=b&&n<130;d=addDays(d,1),n++){const ds=ymd(d);
    const its=oneEach([...dayItems(ds),...plannedOn(ds)]).sort((p,q)=>p.start-q.start);
    if(its.length)out.push(`${shortDate(ds)} (${ds})${ds===t?" TODAY":""}\n`+its.map(x=>"- "+itemText(x)).join("\n"))}
  return out.join("\n")||"Nothing in the planner for those dates.";
}
function findText(q){
  const w=String(q||"").toLowerCase().trim();if(!w)return "Give a word to search for.";
  const hits=[],has=s=>String(s||"").toLowerCase().includes(w);
  state.events.forEach(e=>{if(!has(e.title+" "+(e.note||"")))return;
    hits.push(e.days&&e.days.length?`event, weekly on ${dayStr(e.days)} ${e.start}–${e.end}${e.from?", from "+e.from:""}${e.until?", until "+e.until:""}${e.skip&&e.skip.length?", skipped "+e.skip.join(" "):""}: ${e.title}`:`event ${e.date} ${e.start}–${e.end}: ${e.title}`)});
  state.tasks.forEach(o=>{if(o.status==="dropped"||!has(o.title+" "+(o.note||"")))return;
    if(o.kind==="reminder")hits.push(`reminder ${o.date} ${o.time}: ${o.title}${o.status==="done"?" [done]":""}`);
    else if(o.kind==="routine")hits.push(`routine ${dayStr(o.days)} ${o.time}: ${o.title}`);
    else hits.push(`task: ${o.title}${o.due?" | due "+o.due+(o.dueTime?" "+o.dueTime:""):""} | ${o.status}${o.doneAt?" on "+ymd(new Date(o.doneAt)):""}${o.note?" | note: "+String(o.note).slice(0,140):""}`)});
  return hits.slice(0,60).join("\n")||`No planner items mention "${q}".`;
}
function chatContext(){
  const n=new Date(),t=today(),s=state.settings;
  const tz=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){return ""}})();
  const open=ranked().slice(0,40).map(({t:x},i)=>`${i+1}. ${x.title}${x.due?` | due ${x.due}${x.dueTime?" "+x.dueTime:""}`:" | no due date"} | ${catName(catOf(x))} | ${STAKES[x.stakes||0].toLowerCase()} if missed | ${durLabel(x)}${x.note?" | note: "+String(x.note).slice(0,160):""}`).join("\n");
  const cut=Date.now()-14*864e5;
  const done=state.tasks.filter(x=>isWork(x)&&x.status==="done"&&(x.doneAt||0)>=cut).sort((a,b)=>b.doneAt-a.doneAt).map(x=>`- ${ymd(new Date(x.doneAt))}: ${x.title}`).join("\n");
  const dt=new Set(goalDoneOn(t).map(r=>r.id));
  const gl=goals().map(g=>`- ${g.label} (${isWeekly(g)?"weekly":"daily"}): ${isWeekly(g)?(goalDoneThisWeek(g.id)?"done this week":"not yet this week"):(dt.has(g.id)?"done today":"not yet today")}`).join("\n");
  const kb=(state.knowledge||"").trim();
  return `You are the assistant inside Compass, a university student's personal planner. Answer their questions about their schedule, tasks and plans using ONLY the planner data and the student's own notes below. Two tools help: agenda (any date range) and find (search every item by word, past and finished ones too); use them when the answer may lie outside the dates listed here. If something isn't in the planner or the notes, say so plainly instead of guessing. You can't change the planner: if they want to add or change something, tell them to use "Describe what's coming up" on the Calendar tab.
Style: short and concrete, the answer first, no preamble. Dates like "Thu 20 Nov", 24-hour times. A short bullet list when there are several items.
Now: ${DOW[n.getDay()]} ${t}, ${min2hm(nowMin())}${tz?" ("+tz+")":""}. Their day runs ${s.wake}–${s.sleep}.

## The student's own notes
${kb||"(none)"}

## Agenda, ${shortDate(ymd(addDays(n,-7)))} to ${shortDate(ymd(addDays(n,45)))}
${agendaText(ymd(addDays(n,-7)),ymd(addDays(n,45)))}

## Open tasks, in Compass's priority order
${open||"(none)"}

## Finished in the last 14 days
${done||"(none)"}

## Background goals
${gl||"(none)"}`;
}
const CHAT_TOOLS=[
 {name:"agenda",description:"List everything in the planner for a date range, day by day. Dates as YYYY-MM-DD; at most 120 days.",inputSchema:{type:"object",properties:{from:{type:"string"},to:{type:"string"}},required:["from","to"]},execute:i=>agendaText(i&&i.from,i&&i.to)},
 {name:"find",description:"Search every planner item (events, reminders, tasks, routines; past and finished ones too) for a word or phrase in its title or note.",inputSchema:{type:"object",properties:{query:{type:"string"}},required:["query"]},execute:i=>findText(i&&i.query)}];
function localAnswer(q){
  const low=q.toLowerCase(),n=new Date();let from=null,to=null,label="";
  const wd=["sun","mon","tue","wed","thu","fri","sat"],m=low.match(/\b(sun|mon|tues?|wed|thu|thurs|fri|sat)(day|nesday|rsday|urday)?\b/);
  if(/\b(today|tonight)\b/.test(low)){from=to=today();label="Today"}
  else if(/\b(tomorrow|tmr)\b/.test(low)){from=to=ymd(addDays(n,1));label="Tomorrow"}
  else if(/next week/.test(low)){const mo=addDays(mondayOf(n),7);from=ymd(mo);to=ymd(addDays(mo,6));label="Next week"}
  else if(/weekend/.test(low)){const sat=addDays(mondayOf(n),5);from=ymd(sat<n?n:sat);to=ymd(addDays(mondayOf(n),6));label="This weekend"}
  else if(/\bweek\b/.test(low)){from=today();to=ymd(addDays(mondayOf(n),6));label="Rest of this week"}
  else if(m){const i=wd.indexOf(m[1].slice(0,3));const ds=ymd(addDays(n,(i-n.getDay()+7)%7));from=to=ds;label=fmtDateLong(ds)}
  if(from)return `**${label}**\n`+agendaText(from,to);
  const stop=["what","when","where","have","does","with","about","coming","next","there","many","which","should","work","free","busy","anything","something","much"];
  const words=low.replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>3&&!stop.includes(w));
  for(const w of words){const r=findText(w.replace(/s$/,""));if(!/^No planner items/.test(r))return `Items mentioning **${w}**:\n`+r.split("\n").map(l=>"- "+l).join("\n")}
  return "**Next 3 days**\n"+agendaText(today(),ymd(addDays(n,2)));
}
function mdLite(s){
  const inl=t=>t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g,"$1<i>$2</i>");
  let out="",inList=false;
  esc(s).split("\n").forEach(l=>{const mm=l.match(/^\s*(?:[-•*]|\d+\.)\s+(.*)/);
    if(mm){if(!inList){out+="<ul>";inList=true}out+=`<li>${inl(mm[1])}</li>`}
    else{if(inList){out+="</ul>";inList=false}if(l.trim())out+=`<p>${inl(l.replace(/^#+\s*/,""))}</p>`}});
  return out+(inList?"</ul>":"");
}
function chatHeadHTML(){
  const L=chatList(),avail=!!ai,kb=state.knowledge||"";
  return `<div class="chat-top"><div><h2>Ask about what's coming up</h2><p class="small muted">Answers come only from your planner and the notes you add here.${avail?"":" Claude isn't connected in this view, so answers are basic look-ups."}</p></div>
  <div class="row">${L.length?`<button type="button" class="btn sm ghost" data-a="chatClear">Clear chat</button>`:""}<button type="button" class="btn sm" data-a="kbToggle" aria-expanded="${chatUI.kbOpen}">${chatUI.kbOpen?"Hide my notes":"My notes"}</button></div></div>
  ${chatUI.kbOpen?`<div class="panel kb"><label class="fld" for="kbIn">Things the assistant should know. Saved with your planner.<textarea id="kbIn" class="ask" maxlength="4000" placeholder="e.g. Finals week is 23–28 Nov. My exams are in Building 3. I work at the café Sat 10–14. Prof. Jing only answers email.">${esc(kb)}</textarea></label><div class="task-note-foot"><span id="kbState" aria-live="polite"></span><span class="nums" id="kbCount">${kb.length}/4000</span></div></div>`:""}`;
}
function chatLogHTML(){
  const L=chatList();
  if(!L.length&&!chatUI.busy)return `<div class="chat-empty"><p class="small muted" style="margin:0">Try one of these:</p><div class="suggest">${SUGGEST.map(s=>`<button type="button" class="chip" data-a="chatAsk" data-v="${esc(s)}">${esc(s)}</button>`).join("")}</div></div>`;
  let h=L.map(m=>m.role==="user"?`<div class="msg user"><div class="bubble"><p>${esc(m.text).replace(/\n/g,"<br>")}</p></div></div>`
    :`<div class="msg bot"><div class="bubble">${mdLite(m.text)}${m.local?`<div class="msg-meta">Basic look-up · Claude not connected</div>`:m.stopped?`<div class="msg-meta">Stopped</div>`:""}</div></div>`).join("");
  if(chatUI.busy)h+=`<div class="msg bot" id="chatPending"><div class="bubble">${chatUI.partial?mdLite(chatUI.partial):`<span class="typing" aria-label="Thinking"><i></i><i></i><i></i></span>`}</div></div>`;
  if(chatUI.error)h+=`<p class="small" role="alert" style="color:var(--needle);margin:0">${esc(chatUI.error)}</p>`;
  return h;
}
function nearBottom(){return innerHeight+scrollY>=document.documentElement.scrollHeight-120}
function toBottom(){window.scrollTo({top:document.documentElement.scrollHeight})}
function renderChat(){
  const sig=[chatUI.kbOpen,chatList().length>0,!!ai].join("|");
  if(sig!==chatUI.headSig){chatUI.headSig=sig;$("#chatHead").innerHTML=chatHeadHTML()}
  const lh=chatLogHTML();if(lh!==chatUI.logSig){chatUI.logSig=lh;$("#chatLog").innerHTML=lh}
  const b=$("#chatSendBtn");if(b){b.textContent=chatUI.busy?"Stop":"Send";b.dataset.a=chatUI.busy?"chatStop":"chatSend";b.classList.toggle("needle",chatUI.busy);b.classList.toggle("primary",!chatUI.busy)}
}
function growChat(i){if(!i)return;i.style.height="auto";i.style.height=Math.min(150,i.scrollHeight+2)+"px"}
function chatSendFromInput(){const i=$("#chatIn");if(!i)return;const q=i.value;if(!q.trim()||chatUI.busy)return;i.value="";growChat(i);chatSend(q)}
async function chatSend(q){
  q=String(q||"").trim().slice(0,1000);if(!q||chatUI.busy)return;
  const L=chatList();chatUI.error="";
  const hist=L.slice(-12).map(m=>({role:m.role,content:m.text}));
  L.push({role:"user",text:q,at:Date.now()});
  if(!ai){L.push({role:"assistant",text:localAnswer(q),at:Date.now(),local:true});chatTrim();persist();renderChat();toBottom();return}
  while(hist.length&&hist[0].role!=="user")hist.shift();
  const msgs=[];hist.forEach(m=>{const p=msgs[msgs.length-1];if(p&&p.role===m.role)p.content+="\n\n"+m.content;else msgs.push({...m})});
  const ask=chatContext()+"\n\n## Question\n"+q;
  if(msgs.length&&msgs[msgs.length-1].role==="user")msgs[msgs.length-1].content+="\n\n"+ask;else msgs.push({role:"user",content:ask});
  const ctl=new AbortController();chatUI.busy=true;chatUI.ctl=ctl;chatUI.partial="";renderChat();toBottom();
  let answer=null,stopped=false,local=false;
  try{
    const r=await ai(msgs,{signal:ctl.signal,cache:false,tools:CHAT_TOOLS,onText:({text})=>{const stick=nearBottom();chatUI.partial=text||"";const el=document.querySelector("#chatPending .bubble");if(el){el.innerHTML=mdLite(chatUI.partial);chatUI.logSig=""}if(stick)toBottom()}});
    answer=(r&&r.text)||chatUI.partial||"";
  }catch(e){
    if(ctl.signal.aborted||(e&&e.name==="AbortError")){if(chatUI.partial){answer=chatUI.partial;stopped=true}}
    else if(e&&HARD_OFF.includes(e.code)){ai=null;answer=localAnswer(q);local=true}
    else{chatUI.error=errCopy(e);if(e&&e.text)answer=e.text}
  }
  chatUI.busy=false;chatUI.ctl=null;chatUI.partial="";
  if(answer&&answer.trim())L.push({role:"assistant",text:answer.trim(),at:Date.now(),...(stopped?{stopped:true}:{}),...(local?{local:true}:{})});
  chatTrim();persist();chatUI.headSig="";renderChat();toBottom();
}
let kbTimer=null;
document.addEventListener("input",e=>{const el=e.target;
  if(el.id==="kbIn"){state.knowledge=el.value.slice(0,4000);const c=$("#kbCount"),s=$("#kbState");if(c)c.textContent=state.knowledge.length+"/4000";if(s)s.textContent="Saving…";clearTimeout(kbTimer);kbTimer=setTimeout(()=>{persist();const s2=$("#kbState");if(s2)s2.textContent="Saved"},600)}
  else if(el.id==="chatIn")growChat(el);
  else if(el.id==="ask-desc")el.classList.toggle("has-text",!!el.value.trim());
});
document.addEventListener("keydown",e=>{const el=e.target;
  if(el.id==="chatIn"&&e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();chatSendFromInput()}
  else if(el.id==="ask-desc"&&e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();describe.text=el.value;runDesc()}
});
document.addEventListener("submit",e=>{if(e.target.id==="chatForm"){e.preventDefault();chatSendFromInput()}});
function uiBusy(){return !!(drag||elastic.el||elPull||gdrag||finishing||document.body.classList.contains("dragging"))}
setInterval(()=>{if(!timer&&!uiBusy()&&!document.activeElement.matches("input,select,textarea"))render()},60000);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&setupOpen&&!calEdit){e.preventDefault();closeSetup()}});
/* phone jump links follow the section in view */
if("IntersectionObserver" in window){const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting)document.querySelectorAll("nav.jump button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.v===en.target.id)))})},{rootMargin:"-45% 0px -50% 0px"});["col-now","col-cal","col-tools"].forEach(id=>{const el=document.getElementById(id);if(el)io.observe(el)})}

state=sampleState();render();initStore();initAI();
})();
